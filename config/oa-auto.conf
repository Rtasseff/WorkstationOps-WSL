# config/oa-auto.conf — "oa auto" operation config for WorkstationOps
#
# Registers the OA Archive Tracker's unattended leg (`oa auto`) as a
# scheduled WorkstationOps operation. This is an EXTERNAL job: the heavy
# lifting (flock serialization, venv activation, logging) lives in the
# OAData project's own cron wrapper — WorkstationOps only schedules it and
# reports on its last run. Keeping it here means every timed job on this
# workstation is visible from one place (`./ops status`, `list_cron_jobs`).

OA_AUTO_SCRIPT="/home/rtasseff/projects/OAData/scripts/run_auto.sh"
OA_AUTO_CRON_SCHEDULE="0 7 * * 1-5"    # 07:00, Monday–Friday
OA_AUTO_LOG="/home/rtasseff/projects/OAData/output/auto_cron.log"
